name: Podcast Python Checks

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - ".github/workflows/python-check.yml"
  pull_request:
    paths:
      - "*.py"
      - ".github/workflows/python-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile podcast Python scripts
        run: python -m py_compile *.py
