name: Sync Cloudflare Worker encryption secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Set the existing encryption key on the Cloudflare Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fe93310031ec225f2cb4b21f4aa8f654
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::The CLOUDFLARE_API_TOKEN repository secret is missing."
            exit 1
          fi

          if [[ -z "${CREDENTIAL_ENCRYPTION_KEY}" ]]; then
            echo "::error::The CREDENTIAL_ENCRYPTION_KEY repository secret is missing."
            exit 1
          fi

          printf '%s' "${CREDENTIAL_ENCRYPTION_KEY}" | npx --yes wrangler@4 secret put CREDENTIAL_ENCRYPTION_KEY --name sportnewsauto
