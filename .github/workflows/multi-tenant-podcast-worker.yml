name: Multi-tenant Podcast Worker

on:
  # The Cloudflare Worker Cron Trigger and the website's manual button both
  # dispatch this workflow. GitHub's own schedule trigger is intentionally off.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multi-tenant-podcast-worker
  cancel-in-progress: false

jobs:
  process-workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log worker trigger source
        run: |
          echo "Worker trigger source: $GITHUB_EVENT_NAME"
          echo "Worker started at (UTC): $(date -u --iso-8601=seconds)"

      - name: Validate worker syntax
        run: python -m py_compile tenant_worker.py upload_spreaker.py

      - name: Check required worker secrets
        id: prerequisites
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || { [ -z "$SUPABASE_SECRET_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; } || [ -z "$CREDENTIAL_ENCRYPTION_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Worker is safely inactive. Add the required GitHub Actions secrets to enable multi-workspace processing."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.prerequisites.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight queue dependencies
        if: steps.prerequisites.outputs.enabled == 'true'
        run: python -m pip install --no-cache-dir requests cryptography

      - name: Check for queued worker jobs
        id: pending
        if: steps.prerequisites.outputs.enabled == 'true'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
        run: |
          pending="$(python tenant_worker.py --check-pending)"
          echo "has_work=$pending" >> "$GITHUB_OUTPUT"
          echo "Queued work available: $pending"

      - name: Install podcast pipeline dependencies
        if: steps.prerequisites.outputs.enabled == 'true' && steps.pending.outputs.has_work == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Run account-specific podcast jobs
        if: steps.prerequisites.outputs.enabled == 'true' && steps.pending.outputs.has_work == 'true'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python tenant_worker.py
